[package]
name = "testo-cross-platform"
version = "1.1.5"
description = "Wieloplatformowy testownik"
authors = ["Wojciech Kowal"]
license = "MIT"
repository = "https://github.com/wojtazk/testo-cross-platform"
edition = "2021"
rust-version = "1.82"

# app size optimizations (https://v2.tauri.app/concept/size/)
[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.1"
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-opener = "2.5.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"
